<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:"Helvetica Neue",Arial,"DejaVu Sans",sans-serif;color:#1f2933}
.fig{width:1100px;padding:20px;box-sizing:border-box;background:#fff}
svg{display:block}
svg text{font-family:inherit}
</style></head><body>
<!-- Both figures are drawn 1100 px wide so that the text prints at about 7 pt when the figure is placed at A4 text width. -->
<div class="fig" id="fig1"><svg id="s1" width="1060" height="606" viewBox="0 0 1060 606"></svg></div>
<div class="fig" id="fig2"><svg id="s2" width="1060" height="668" viewBox="0 0 1060 668">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
</svg></div>
<script>
const NS="http://www.w3.org/2000/svg";
function mk(svg){return (n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.appendChild(e);return e}}

/* ---------------- Figure 1: timelines ---------------- */
(function(){
const el=mk(document.getElementById("s1"));
const X=y=>62+(y-2019)*122, RX="#b4432e", ZP="#1f6f78", INK="#1f2933";
const RT=208, BH=30, ZT=302;                       // bar tops and bar height
// year axis
for(let y=2019;y<=2027;y++){el("line",{x1:X(y),y1:248,x2:X(y),y2:292,stroke:"#cbd2d9","stroke-width":1.5});
  if(y<2027)el("text",{x:X(y)+61,y:277,"text-anchor":"middle","font-size":19,"font-weight":700,fill:"#52606d"},y)}
// lanes
el("rect",{x:X(2019.15),y:RT,width:X(2022.77)-X(2019.15),height:BH,rx:5,fill:RX});
el("text",{x:(X(2019.15)+X(2022.77))/2,y:RT+21,"text-anchor":"middle","font-size":17,"font-weight":700,fill:"#fff"},"FedEx Roxo: 44 months of tests and pilots");
el("text",{x:X(2022.77)+14,y:RT+21,"text-anchor":"start","font-size":17,"font-weight":700,fill:RX},"no commercial launch reported");
el("text",{x:X(2023.2)-12,y:ZT+21,"text-anchor":"end","font-size":17,"font-weight":700,fill:ZP},"Zipline Platform 2");
el("rect",{x:X(2023.2),y:ZT,width:X(2025.05)-X(2023.2),height:BH,rx:5,fill:"#7fb3b9"});
el("text",{x:(X(2023.2)+X(2025.05))/2,y:ZT+21,"text-anchor":"middle","font-size":17,"font-weight":700,fill:"#0b3d43"},"22 months of testing");
el("rect",{x:X(2025.05),y:ZT,width:X(2026.9)-X(2025.05),height:BH,rx:5,fill:ZP});
el("text",{x:(X(2025.05)+X(2026.9))/2,y:ZT+21,"text-anchor":"middle","font-size":17,"font-weight":700,fill:"#fff"},"Customers and scaling");
// events: lane r is drawn above the axis, lane z below it
function ev(yr,lane,level,lines,anchor,dx){dx=dx||0; const x=X(yr), up=lane=="r", c=up?RX:ZP;
  const y0=up?RT:ZT+BH, y1=up?RT-26-level*64:ZT+BH+26+level*76, ROW=23;
  el("line",{x1:x,y1:y0,x2:x,y2:y1,stroke:c,"stroke-width":1.8,"data-leader":1});
  el("circle",{cx:x,cy:y0,r:6,fill:"#fff",stroke:c,"stroke-width":2.6});
  const tx=(anchor=="end"?x+4:anchor=="middle"?x:x-4)+dx;
  lines.forEach((t,i)=>{const yy=up?y1-8-(lines.length-1-i)*ROW:y1+20+i*ROW;
    el("text",{x:tx,y:yy,"text-anchor":anchor,"font-size":18,"font-weight":i==0?700:400,fill:i==0?c:INK,"data-label":1},t)})}
ev(2019.15,"r",0,["Feb 2019","Shown on TV"],"middle");
ev(2019.90,"r",2,["Nov 2019","New York cease-and-desist order"],"start");
ev(2020.03,"r",1,["Jan 2020","Commercial pilots still only a hope"],"start");
ev(2021.52,"r",0,["Jul 2021","'First appearance in Asia Pacific'"],"middle",-12);
ev(2022.72,"r",2,["Sep 2022","Cost savings announced"],"start");
ev(2022.77,"r",1,["Oct 2022","Programme ended"],"start",12);
ev(2023.20,"z",0,["Mar 2023","Platform 2 unveiled; customers","expected 'early next year'"],"end");
ev(2023.72,"z",1,["Sep 2023","FAA beyond-line-of-sight approval","(first-generation drone)"],"start");
ev(2025.05,"z",0,["Jan 2025","First P2 customer delivery"],"middle");
ev(2026.86,"z",2,["Nov 2026","$1.5bn raised","Walmart adds 300 sites to 21","Uber Eats service starts"],"end");
})();

/* ---------------- Figure 2: recommended process ---------------- */
(function(){
const el=mk(document.getElementById("s2"));
const T="#1f6f78", B="#8a5a1c", G="#52606d", INK="#1f2933", MUT="#3e4c59", RX="#b4432e";
const CY=222, HH=112;                               // diamond centre and half height
const D=[[10,480,T,"#e6f1f2"],[524,994,B,"#f3ece3"]];
// iteration note and arrow
el("text",{x:502,y:24,"text-anchor":"middle","font-size":17,fill:G},"A failed test returns the team to Define; lessons from delivery start a new round");
el("path",{d:"M 668 146 C 600 56, 404 56, 334 142",fill:"none",stroke:G,"stroke-width":2,"stroke-dasharray":"7 5","marker-end":"url(#ar)"});
// headings
el("text",{x:10,y:86,"text-anchor":"start","font-size":19,"font-weight":700,fill:T},"Understand the right problem");
el("text",{x:994,y:86,"text-anchor":"end","font-size":19,"font-weight":700,fill:B},"Build the right solution");
// diamonds
D.forEach(([x0,x1,c,f])=>{const m=(x0+x1)/2;
  el("polygon",{points:`${x0},${CY} ${m},${CY-HH} ${x1},${CY} ${m},${CY+HH}`,fill:f,stroke:c,"stroke-width":2.5});
  el("line",{x1:m,y1:CY-HH,x2:m,y2:CY+HH,stroke:c,"stroke-dasharray":"6 6","stroke-width":1.5})});
const stage=[["DISCOVER",151,T],["DEFINE",339,T],["DEVELOP",665,B],["DELIVER",853,B]];
stage.forEach(([n,x,c])=>el("text",{x:x,y:CY+8,"text-anchor":"middle","font-size":23,"font-weight":700,fill:c},n));
// decision gates
[502,1024].forEach(x=>{el("circle",{cx:x,cy:CY,r:17,fill:"#fff",stroke:G,"stroke-width":2.5});
  el("text",{x:x,y:CY+6,"text-anchor":"middle","font-size":17,"font-weight":700,fill:G},"?");
  el("text",{x:x,y:CY+44,"text-anchor":"middle","font-size":15.5,fill:G},"decision");
  el("text",{x:x,y:CY+63,"text-anchor":"middle","font-size":15.5,fill:G},"gate")});
// Roxo marker on Define
el("circle",{cx:339,cy:CY+34,r:6,fill:RX});
el("line",{x1:339,y1:CY+34,x2:339,y2:CY+HH+16,stroke:RX,"stroke-width":2});
el("rect",{x:206,y:CY+HH+16,width:266,height:32,rx:6,fill:RX});
el("text",{x:339,y:CY+HH+38,"text-anchor":"middle","font-size":17,"font-weight":700,fill:"#fff"},"Roxo never closed this stage");
// cards: what to do and the output of each stage
const cards=[
 [10,"Discover",T,["Study the problem","before the technology"],["ranked list of","evidenced problems"]],
 [251,"Define",T,["Write the brief and","the exit before building"],["signed brief with","measures and exit"]],
 [524,"Develop",B,["Build cheaply; test the","riskiest assumption first"],["assumptions","tested with users"]],
 [765,"Deliver",B,["Start narrow with paying","customers; scale by gates"],["go, hold or stop","at each gate"]]];
const CT=394, CW=229, CH=158;
cards.forEach(([x,name,c,act,out])=>{
  el("rect",{x:x,y:CT,width:CW,height:CH,rx:8,fill:"#fff",stroke:"#9aa5b1","stroke-width":1.5});
  el("rect",{x:x,y:CT,width:CW,height:6,rx:3,fill:c});
  el("text",{x:x+14,y:CT+32,"font-size":18,"font-weight":700,fill:c},name);
  act.forEach((t,i)=>el("text",{x:x+14,y:CT+58+i*22,"font-size":17,fill:INK},t));
  el("text",{x:x+14,y:CT+112,"font-size":17,"font-weight":700,fill:MUT},"Output:");
  out.forEach((t,i)=>el("text",{x:x+(i==0?82:14),y:CT+112+i*22,"font-size":17,fill:MUT},t));
});
// leadership band
el("rect",{x:10,y:572,width:984,height:90,rx:10,fill:"#f5f7fa",stroke:"#9aa5b1","stroke-dasharray":"6 5","stroke-width":1.5});
el("text",{x:28,y:600,"font-size":18,"font-weight":700,fill:INK},"What the model leaves out, and leaders must supply");
el("text",{x:28,y:625,"font-size":17,fill:MUT},"Ring-fenced exploration budget  ·  a separate unit integrated at senior level  ·");
el("text",{x:28,y:648,"font-size":17,fill:MUT},"staged funding against agreed evidence  ·  reward for bad news");
})();

/* ---------------- layout check: reports overlapping text and text too close to a leader line ---------------- */
window.layoutReport=function(){const out=[];
  for(const id of ["s1","s2"]){const svg=document.getElementById(id), W=+svg.getAttribute("width"), H=+svg.getAttribute("height");
    const ts=[...svg.querySelectorAll("text")].map(t=>({t:t.textContent,b:t.getBBox()}));
    ts.forEach(a=>{if(a.b.x<2||a.b.x+a.b.width>W-2||a.b.y<0||a.b.y+a.b.height>H)out.push(id+" OUTSIDE: "+a.t+" ["+Math.round(a.b.x)+".."+Math.round(a.b.x+a.b.width)+"]")});
    for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){const a=ts[i].b,b=ts[j].b;
      if(a.x<b.x+b.width+4&&b.x<a.x+a.width+4&&a.y+3<b.y+b.height-3&&b.y+3<a.y+a.height-3)out.push(id+" TEXT OVERLAP: "+ts[i].t+" | "+ts[j].t)}
    [...svg.querySelectorAll("line[data-leader]")].forEach(l=>{const x=+l.getAttribute("x1"),ya=Math.min(+l.getAttribute("y1"),+l.getAttribute("y2")),yb=Math.max(+l.getAttribute("y1"),+l.getAttribute("y2"));
      ts.forEach(a=>{const b=a.b; if(x>b.x-9&&x<b.x+b.width+9&&ya<b.y+b.height-4&&yb>b.y+4)out.push(id+" LINE TOO CLOSE x="+Math.round(x)+": "+a.t+" ["+Math.round(b.x)+".."+Math.round(b.x+b.width)+"]")})});
    ts.filter(a=>/months|Customers|Roxo never|FedEx Roxo:/.test(a.t)).forEach(a=>out.push(id+" width "+Math.round(a.b.width)+": "+a.t));
  }
  return out};
</script></body></html>
